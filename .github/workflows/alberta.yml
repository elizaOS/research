name: alberta

# CI for the Alberta Framework (JAX continual-RL). Two lanes, mirroring the
# e1-chip-fast / e1-chip split:
#
#   fast — per-PR (and non-main push) gate: ruff + `pytest -m "not slow"`.
#          The full suite is ~36 min serial on a 24-core dev box; hosted
#          runners are slower, so the fast lane drops the `slow`-marked
#          modules (>~30s each serial) and parallelizes the rest with
#          pytest-xdist (`-n auto --dist loadfile`).
#   full — the whole suite, on push to main and manual dispatch only.
#          Budget: expect tens of minutes on hosted runners even under
#          xdist; both lanes carry timeout-minutes: 90.
#
# Both lanes run a python matrix of 3.12 + 3.13: the robot lane consumes this
# package in-process on 3.12 (brax/mujoco pin numpy<2 there), while upstream
# targets 3.13. The tests that import the vendored-out benchmarks/ and
# "examples/The Alberta Plan/" trees — which this standalone repo does not
# ship — are excluded via tests/conftest.py (collect_ignore) and pyproject
# [tool.ruff]; the shipped alberta_framework library itself lints and tests
# clean.
on:
  push:
    branches: [develop, main]
    paths:
      - "alberta/**"
      - ".github/workflows/alberta.yml"
  pull_request:
    paths:
      - "alberta/**"
      - ".github/workflows/alberta.yml"
  workflow_dispatch:

concurrency:
  group: alberta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-PR gate: lint + everything not marked `slow`.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: alberta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: alberta/pyproject.toml

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]' pytest-xdist

      - name: Lint
        run: ruff check .

      - name: Test (fast lane, -m "not slow")
        run: python -m pytest tests/ -q -o addopts="" -m "not slow" -n auto --dist loadfile --durations=25

  # Full suite: push to main + manual dispatch (mirrors the e1-chip heavy lane).
  full:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: alberta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: alberta/pyproject.toml

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]' pytest-xdist

      - name: Lint
        run: ruff check .

      - name: Test (full suite)
        run: python -m pytest tests/ -q -o addopts="" -n auto --dist loadfile --durations=25
