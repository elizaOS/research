name: typescript

# Per-PR gate for the self-contained TypeScript surfaces (plugin-ainex + the
# robot TS re-export layer). Resolves @elizaos/core from published npm, then
# lints (biome), typechecks (tsgo), and runs vitest. Fast (< 1 min); the heavy
# robot Python/mujoco lane is robot.yml, not here.
on:
  push:
    branches: [develop, main]
    paths:
      - "plugin-ainex/**"
      - "robot/**"
      - "package.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "plugin-ainex/**"
      - "robot/**"
      - "package.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"

concurrency:
  group: typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Installs the root workspace + both members (plugin-ainex, robot) and
      # pulls @elizaos/core@2.0.3-beta.7 (with its zod ^4 tree) from npm.
      - name: Install dependencies
        run: bun install

      # biome check (lint, no --write); config biome.json scoped to the TS surfaces.
      - name: Lint
        run: bun run lint

      # Each member runs `tsgo --noEmit` (@typescript/native-preview).
      - name: Typecheck
        run: bun run typecheck

      # plugin-ainex: 4 vitest files / 18 tests. robot TS: passWithNoTests
      # (its behavioral tests are the Python lane in robot.yml).
      - name: Test
        run: bun run test
